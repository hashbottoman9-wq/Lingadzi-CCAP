<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUTH — Lingadzi CCAP Media</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="gate" id="gate" style="background-image: url('https://placehold.co/1600x900/222/fff?text=Weddings+Cover');">
    <div class="gate-overlay">
      <h1>YOUTH</h1>
      <p class="gate-sub">Lingadzi CCAP Media</p>
      <p class="gate-label"><strong>Guest Access.</strong> Enter your email to view this collection.</p>
      <input type="email" id="gate-email" placeholder="Your email" class="gate-input">
      <button id="gate-enter" class="gate-btn">ENTER</button>
    </div>
  </section>

  <div id="album-content" class="hidden">
    <header class="site-header">
      <a href="index.html" class="back-link">&larr; Back to Collections</a>
      <h1 class="logo">YOUTH</h1>
      <p class="tagline">August 2026</p>
    </header>
    <main class="gallery">
      <div class="photo-card"><img src="https://placehold.co/600x400/222/fff?text=Photo+1" alt="Photo"></div>
      <div class="photo-card"><img src="https://placehold.co/600x800/222/fff?text=Photo+2" alt="Photo"></div>
      <div class="photo-card"><img src="https://placehold.co/600x400/222/fff?text=Photo+3" alt="Photo"></div>
    </main>
    <footer class="site-footer"><p>&copy; 2026 Lingadzi CCAP Media. All rights reserved.</p></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
