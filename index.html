<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash creations</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">HASH <span>Creations</span></h1>
    <p class="tagline">Photography</p>
  </header>

  <nav class="category-nav">
    <button class="cat-btn active" data-category="all">All</button>
    <button class="cat-btn" data-category="events">Events</button>
    <button class="cat-btn" data-category="portraits">Portraits</button>
    <button class="cat-btn" data-category="commercial">Commercial</button>
    <button class="cat-btn" data-category="weddings">Weddings</button>
  </nav>

  <main class="gallery" id="gallery">
    <div class="photo-card" data-category="events">
      <img src="https://placehold.co/600x400/222/fff?text=Event+Photo" alt="Event photo">
    </div>
    <div class="photo-card" data-category="portraits">
      <img src="https://placehold.co/600x800/222/fff?text=Portrait" alt="Portrait photo">
    </div>
    <div class="photo-card" data-category="commercial">
      <img src="https://placehold.co/600x400/222/fff?text=Commercial" alt="Commercial photo">
    </div>
    <div class="photo-card" data-category="weddings">
      <img src="https://placehold.co/600x800/222/fff?text=Wedding" alt="Wedding photo">
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Hash creations. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
